<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PESCE Mandya — 3D Multiplayer Campus, Football & Interactive Faculty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #29E7F2; --blue: #4facfe; --purple: #9B5CFF;
            --gold: #FFC857; --emerald: #5CFFB1; --crimson: #FF5C77;
            --dark: #0B1020; --glass: rgba(11, 16, 32, 0.86);
            --border: rgba(41, 231, 242, 0.28);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--dark); color: #F3F6FF; height: 100dvh; width: 100vw; overflow: hidden; position: relative; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: crosshair; }
        
        #reticle { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; transform: translate(-50%, -50%); border: 1.5px solid rgba(255, 255, 255, 0.75); border-radius: 50%; z-index: 5; pointer-events: none; transition: 0.18s; }
        #reticle.hover-active { transform: translate(-50%, -50%) scale(1.9); border-color: var(--cyan); background-color: rgba(41, 231, 242, 0.35); box-shadow: 0 0 12px var(--cyan); }

        /* HEADER */
        header { position: absolute; top: 10px; left: 14px; right: 14px; z-index: 20; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; pointer-events: none; }
        header > * { pointer-events: auto; }
        .brand-nav-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .club-logo-badge { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--border); padding: 4px 14px 4px 5px; border-radius: 50px; backdrop-filter: blur(14px); text-decoration: none; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .club-logo-badge img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--cyan); background: #fff; }
        .club-logo-text { display: flex; flex-direction: column; }
        .club-logo-text strong { font-family: 'Orbitron', sans-serif; font-size: 0.82rem; letter-spacing: 1px; color: var(--cyan); }
        .club-logo-text span { font-size: 0.6rem; color: #9AA8C2; letter-spacing: 0.4px; }
        .stage-nav { display: flex; gap: 6px; align-items: center; font-size: 0.76rem; font-weight: 600; flex-wrap: wrap; }
        .stage-nav a { color: #cbd5e1; text-decoration: none; padding: 7px 13px; border-radius: 20px; background: var(--glass); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(14px); transition: 0.25s; }
        .stage-nav a:hover { color: var(--cyan); border-color: var(--cyan); }
        .stage-nav a.active { color: #0B1020; background: var(--cyan); border-color: var(--cyan); font-weight: 700; box-shadow: 0 0 15px rgba(41,231,242,0.35); }
        .top-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .hud-pill-btn, .hud-select { background: var(--glass); border: 1px solid rgba(255,255,255,0.16); color: #f8fafc; padding: 7px 11px; border-radius: 11px; font-size: 0.73rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(14px); transition: 0.2s; outline: none; }
        .hud-pill-btn:hover, .hud-select:hover { border-color: var(--cyan); color: var(--cyan); }
        .hud-pill-btn.active-mode { background: rgba(41, 231, 242, 0.22); border-color: var(--cyan); color: #fff; }
        .hud-select option { background: #0f172a; color: #fff; }

        /* VOXEL AVATAR CUSTOMIZER */
        .customizer-card { background: rgba(11, 16, 32, 0.97); border: 1.5px solid var(--purple); border-radius: 22px; width: 100%; max-width: 580px; max-height: 88dvh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 65px rgba(0,0,0,0.85), 0 0 35px rgba(155, 92, 255, 0.25); user-select: text; }
        .customizer-header { padding: 15px 20px; background: linear-gradient(90deg, rgba(155, 92, 255, 0.22), rgba(41, 231, 242, 0.16)); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .customizer-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.02rem; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
        .customizer-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .cust-row { display: flex; flex-direction: column; gap: 6px; }
        .cust-row label { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--gold); letter-spacing: 0.8px; text-transform: uppercase; }
        .cust-input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cust-text-input, .cust-select-input { background: #070b16; border: 1px solid rgba(255,255,255,0.18); color: #fff; padding: 9px 12px; border-radius: 10px; font-size: 0.82rem; outline: none; }
        .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-swatch { width: 34px; height: 34px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.15s; }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.selected { border-color: #ffffff; box-shadow: 0 0 12px var(--cyan); transform: scale(1.12); }
        .acc-pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .acc-pill { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); color: #e2e8f0; padding: 7px 14px; border-radius: 10px; font-size: 0.76rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .acc-pill.selected { background: rgba(41, 231, 242, 0.22); border-color: var(--cyan); color: var(--cyan); }
        .customizer-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(2, 6, 23, 0.9); display: flex; justify-content: space-between; align-items: center; }

        /* LEFT NAVIGATION DRAWER */
        .left-drawer-wrap { position: absolute; top: 66px; left: 14px; z-index: 18; display: flex; align-items: flex-start; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        .left-drawer-wrap.collapsed { transform: translateX(calc(-100% + 38px)); }
        .zone-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 12px; backdrop-filter: blur(16px); display: flex; flex-direction: column; gap: 4px; width: 260px; max-height: calc(100dvh - 160px); overflow-y: auto; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .zone-panel::-webkit-scrollbar { width: 4px; }
        .zone-panel::-webkit-scrollbar-thumb { background: rgba(41, 231, 242, 0.35); border-radius: 4px; }
        .drawer-tab-btn { background: rgba(11, 16, 32, 0.92); border: 1.5px solid var(--cyan); color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 800; padding: 10px 8px; cursor: pointer; backdrop-filter: blur(14px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: 0.2s; writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; }
        .drawer-tab-btn:hover { background: var(--cyan); color: #0B1020; }
        .left-tab-btn { border-left: none; border-radius: 0 12px 12px 0; margin-top: 12px; }
        .zone-panel-title { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--cyan); font-weight: 800; margin-top: 6px; margin-bottom: 2px; }
        .zone-btn { background: rgba(2, 6, 23, 0.65); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; padding: 6px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .zone-btn:hover, .zone-btn.active { background: rgba(41, 231, 242, 0.18); border-color: var(--cyan); color: #fff; transform: translateX(3px); }
        .mentor-locate-btn { background: linear-gradient(135deg, rgba(255, 200, 87, 0.16), rgba(11, 16, 32, 0.9)); border: 1px solid rgba(255, 200, 87, 0.45); color: var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 0.73rem; font-weight: 700; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .mentor-locate-btn:hover { background: rgba(255, 200, 87, 0.28); border-color: var(--gold); color: #fff; transform: translateX(3px); }
        .online-roster-box { margin-top: 6px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 4px; }
        .online-user-chip { font-size: 0.72rem; color: #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 6px; background: rgba(92, 255, 177, 0.08); border: 1px solid rgba(92, 255, 177, 0.25); cursor: pointer; }

        /* RIGHT RADAR MAP DRAWER */
        .right-drawer-wrap { position: absolute; top: 66px; right: 14px; z-index: 18; display: flex; align-items: flex-start; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
        .right-drawer-wrap > * { pointer-events: auto; }
        .right-drawer-wrap.collapsed { transform: translateX(calc(100% - 38px)); }
        .right-tab-btn { border-right: none; border-radius: 12px 0 0 12px; margin-top: 12px; }
        .right-hud-stack { width: 285px; display: flex; flex-direction: column; gap: 10px; }
        .minimap-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 10px; backdrop-filter: blur(16px); box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 6px; }
        .minimap-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Orbitron', sans-serif; font-size: 0.68rem; color: var(--cyan); font-weight: 800; }
        #minimap-canvas { width: 100%; height: 165px; border-radius: 10px; background: #070b16; border: 1px solid rgba(255,255,255,0.12); cursor: pointer; }
        .info-card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 12px; backdrop-filter: blur(16px); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .info-card h3 { color: var(--gold); font-family: 'Orbitron', sans-serif; font-size: 0.86rem; margin-bottom: 4px; }
        .info-card p { color: #cbd5e1; font-size: 0.75rem; line-height: 1.42; }

        /* FOOTBALL, CHAT & FACULTY MODALS */
        .multiplayer-chat-dock { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 25; width: 92%; max-width: 540px; background: rgba(11, 16, 32, 0.92); border: 1.5px solid var(--cyan); border-radius: 16px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(16px); transition: transform 0.35s; }
        .multiplayer-chat-dock.collapsed { transform: translate(-50%, calc(100% + 12px)); }
        .chat-slide-handle { position: absolute; top: -29px; left: 50%; transform: translateX(-50%); background: rgba(11, 16, 32, 0.94); border: 1.5px solid var(--cyan); border-bottom: none; color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 0.66rem; font-weight: 800; padding: 5px 16px; border-radius: 12px 12px 0 0; cursor: pointer; }
        .chat-feed-mini { max-height: 54px; overflow-y: auto; font-size: 0.74rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 3px; padding: 0 4px; }
        .chat-input-row { display: flex; gap: 8px; align-items: center; }
        .chat-input-row input { flex: 1; background: rgba(2, 6, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; padding: 8px 13px; border-radius: 10px; font-size: 0.82rem; outline: none; user-select: text; -webkit-user-select: text; }
        .chat-send-btn { background: var(--cyan); color: #0B1020; border: none; padding: 8px 15px; border-radius: 10px; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 800; cursor: pointer; }

        #football-hud { position: absolute; top: 66px; left: 50%; transform: translateX(-50%); z-index: 16; background: rgba(11, 16, 32, 0.92); border: 1.5px solid var(--emerald); border-radius: 16px; padding: 10px 18px; display: none; flex-direction: column; align-items: center; gap: 6px; backdrop-filter: blur(16px); }
        .score-row { display: flex; align-items: center; gap: 16px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.05rem; }
        .score-pill { background: #050811; border: 1px solid rgba(255,255,255,0.18); padding: 3px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; color: #fff; }
        .kick-action-btn { background: linear-gradient(135deg, var(--emerald), var(--cyan)); color: #0B1020; border: none; padding: 6px 14px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 800; cursor: pointer; transition: 0.15s; }
        
        #interact-prompt { position: absolute; bottom: 145px; left: 50%; transform: translateX(-50%); z-index: 18; background: rgba(11, 16, 32, 0.94); border: 1.5px solid var(--gold); color: #fff; padding: 9px 18px; border-radius: 30px; font-size: 0.82rem; font-weight: 700; pointer-events: auto; cursor: pointer; display: none; align-items: center; gap: 8px; }
        #interact-prompt span.key-badge { background: var(--gold); color: #030712; padding: 3px 8px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.72rem; }

        #mentor-chat-modal { position: fixed; top: 68px; right: 16px; bottom: 82px; width: 420px; max-width: calc(100vw - 28px); z-index: 55; display: none; pointer-events: auto; }
        .mentor-modal-card { background: rgba(11, 16, 32, 0.94); border: 1.5px solid var(--gold); border-radius: 20px; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(18px); box-shadow: -10px 20px 60px rgba(0,0,0,0.75); animation: slideInMentor 0.28s; }
        @keyframes slideInMentor { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .mentor-header { background: linear-gradient(90deg, rgba(255, 200, 87, 0.16), rgba(11, 16, 32, 0.95)); padding: 13px 16px; border-bottom: 1px solid rgba(255, 200, 87, 0.3); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .mentor-portrait-canvas { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--gold); background: #0f172a; flex-shrink: 0; }
        .mentor-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.83rem; user-select: text; }
        .m-msg { padding: 10px 14px; border-radius: 12px; line-height: 1.52; max-width: 90%; white-space: pre-wrap; }
        .m-msg.bot { background: rgba(30, 41, 59, 0.88); border: 1px solid rgba(255, 200, 87, 0.32); color: #f8fafc; align-self: flex-start; }
        .m-msg.user { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #0B1020; align-self: flex-end; font-weight: 600; }
        .mentor-input-area { padding: 10px 12px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 6px; background: rgba(2, 6, 23, 0.95); align-items: center; }
        .mentor-input-area input { flex: 1; background: #0B1020; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 9px 12px; border-radius: 10px; outline: none; }
        
        .sarvam-fab { position: fixed; bottom: 14px; right: 14px; z-index: 40; background: linear-gradient(135deg, var(--purple), #FF4FD8); color: #fff; border: 1.5px solid var(--cyan); padding: 10px 16px; border-radius: 50px; font-family: 'Orbitron', sans-serif; font-size: 0.74rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(155, 92, 255, 0.5); }
        .sarvam-window { position: fixed; bottom: 68px; right: 14px; z-index: 45; width: 360px; max-width: calc(100vw - 28px); height: 465px; background: rgba(11, 16, 32, 0.96); border: 1.5px solid var(--cyan); border-radius: 18px; display: none; flex-direction: column; overflow: hidden; backdrop-filter: blur(20px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 10, 22, 0.78); backdrop-filter: blur(10px); z-index: 50; display: none; justify-content: center; align-items: center; padding: 16px; }

        @media (max-width: 900px) {
            .left-drawer-wrap { top: 72px; left: 0; } .left-drawer-wrap.collapsed { transform: translateX(calc(-100% + 32px)); }
            .right-drawer-wrap { top: 72px; right: 0; } .right-drawer-wrap.collapsed { transform: translateX(calc(100% - 32px)); }
            .multiplayer-chat-dock { width: 94%; bottom: 8px; }
            #mentor-chat-modal { top: auto; bottom: 0; left: 0; right: 0; width: 100%; max-width: 100%; height: 60dvh; }
            .mentor-modal-card { border-radius: 20px 20px 0 0; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="reticle"></div>

    <div id="football-hud">
        <div class="score-row"><span class="team-cyan">⚡ CYAN</span> <span class="score-pill"><span id="score-cyan">0</span> : <span id="score-gold">0</span></span> <span class="team-gold">GOLD 🔥</span></div>
        <div class="pitch-actions-row">
            <button class="kick-action-btn" onclick="kickFootball(14.5, 2.2)">⚽ KICK [F]</button>
            <button class="kick-action-btn" style="background:linear-gradient(135deg, var(--gold), #f97316);" onclick="kickFootball(17.5, 5.2)">🚀 POWER [G]</button>
        </div>
    </div>
    <div id="interact-prompt" onclick="triggerActiveInteraction()">
        <span class="key-badge">E / Click</span> <span id="interact-label">Interact</span>
    </div>

    <!-- AVATAR CUSTOMIZER -->
    <div class="modal-overlay" id="avatar-customizer-modal">
        <div class="customizer-card">
            <div class="customizer-header">
                <h2>🎨 VOXEL AVATAR STUDIO</h2>
                <button class="hud-pill-btn" onclick="closeAvatarCustomizer()">✕ Close [Esc]</button>
            </div>
            <div class="customizer-body">
                <div class="cust-input-grid">
                    <div class="cust-row"><label>Callsign</label><input type="text" id="cust-name-input" class="cust-text-input" maxlength="20"></div>
                    <div class="cust-row"><label>Title</label><select id="cust-title-select" class="cust-select-input"><option>Tachyon Explorer</option><option>AI Agent Builder</option></select></div>
                </div>
                <div class="cust-row"><label>👕 Shirt Color</label><div class="swatch-row" id="swatch-shirt"></div></div>
                <div class="cust-row"><label>👖 Pants Color</label><div class="swatch-row" id="swatch-pants"></div></div>
                <div class="cust-row"><label>🎒 Backpack / Accent</label><div class="swatch-row" id="swatch-eyes"></div></div>
            </div>
            <div class="customizer-footer">
                <button class="chat-send-btn" onclick="saveAvatarCustomization()">💾 Save Voxel Avatar</button>
            </div>
        </div>
    </div>

    <!-- MENTOR CHAT MODAL -->
    <div id="mentor-chat-modal">
        <div class="mentor-modal-card">
            <div class="mentor-header">
                <div class="mentor-info">
                    <canvas id="mentor-portrait-canvas" class="mentor-portrait-canvas" width="92" height="92"></canvas>
                    <div class="mentor-titles">
                        <strong id="mentor-name-display">Faculty</strong>
                        <span class="role-sub" id="mentor-role-display">Role</span>
                    </div>
                </div>
                <button class="hud-pill-btn" onclick="closeMentorChatModal()">✕ End [Esc]</button>
            </div>
            <div class="mentor-messages" id="mentor-messages-container"></div>
            <div class="mentor-input-area">
                <input type="text" id="mentor-user-input" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMentorMessage()">
                <button class="mentor-send-btn" id="btn-mentor-send" onclick="sendMentorMessage()">Send</button>
            </div>
        </div>
    </div>

    <header>
        <div class="brand-nav-wrap">
            <a href="index.html" class="club-logo-badge">
                <img src="WhatsApp Image 2026-10-19 at 2.21.46 PM.jpeg" onerror="this.onerror=null; this.src='tachyon-logo.jpg';">
                <div class="club-logo-text"><strong>TACHYON</strong><span>VIRTUAL CAMPUS</span></div>
            </a>
        </div>
        <div class="top-controls">
            <button class="hud-pill-btn" style="border-color:var(--purple); color:#e9d5ff;" onclick="openAvatarCustomizer()">🎨 Customize [C]</button>
            <span class="hud-pill-btn" id="my-online-badge" style="border-color:var(--emerald); color:var(--emerald);">🟢 Online Mode</span>
            <button class="hud-pill-btn active-mode" id="btn-viewmode" onclick="togglePerspectiveMode()">🧍 3rd Person</button>
        </div>
    </header>

    <div class="left-drawer-wrap" id="left-drawer">
        <aside class="zone-panel">
            <div class="zone-panel-title" style="color:var(--gold);">🎓 Interactive Faculty</div>
            <button class="mentor-locate-btn" onclick="walkToFacultyMentor('umesh')"><span>👨‍🏫 Dr. Umesh D. R.</span></button>
            <button class="mentor-locate-btn" onclick="walkToFacultyMentor('chetan')"><span>👨‍💻 Prof. Chetan V.</span></button>

            <div class="zone-panel-title">🏢 Campus Zones</div>
            <button class="zone-btn active" onclick="teleportTo('quad')"><span>⛲ Central Quad</span></button>
            <button class="zone-btn" onclick="teleportTo('crc')"><span>🏢 CRC Glass Tower</span></button>
            <button class="zone-btn" onclick="teleportTo('gbl')"><span>🏛️ GBL Heritage Block</span></button>
            <button class="zone-btn" onclick="teleportTo('pavilion')"><span>🚀 Innovation Pavilion</span></button>
            <button class="zone-btn" onclick="teleportTo('sports')"><span>⚽ Football Stadium</span></button>
        </aside>
        <button class="drawer-tab-btn left-tab-btn" id="left-drawer-btn" onclick="toggleLeftDrawer()">◀ ZONES</button>

            if (divisions > 1) {
                const step = size / divisions; dCtx.strokeStyle = groutHex; dCtx.lineWidth = 3;
                for (let i = 0; i <= divisions; i++) {
                    const p = i * step; dCtx.beginPath(); dCtx.moveTo(p, 0); dCtx.lineTo(p, size); dCtx.stroke();
                    dCtx.beginPath(); dCtx.moveTo(0, p); dCtx.lineTo(size, p); dCtx.stroke();
                }

            const map = new THREE.CanvasTexture(diffCanvas); map.encoding = THREE.sRGBEncoding; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.repeat.set(repeatX, repeatY);
            return { map };
        }

            loadingDiv.remove();
            if (!replyText) replyText = mentorId === "umesh" ? "That is an important problem. Start by defining your evaluation metrics and checking your dataset for leakage. What baseline metric have you recorded?" : "Let's break that down practically. First isolate the data ingestion bottleneck, benchmark your latency, and test with a smaller batch. What logs are you seeing?";
            
            mentorHistories[mentorId].push({ role: "assistant", content: replyText });
            const botDiv = document.createElement("div"); botDiv.className = "m-msg bot"; botDiv.textContent = replyText; msgBox.appendChild(botDiv); msgBox.scrollTop = msgBox.scrollHeight;
            speakMentorUtterance(npc, replyText);
            isMentorRequestInFlight = false; document.getElementById("btn-mentor-send").disabled = false;
        };

        // ============================================================================
        // MASTER ANIMATION & RENDER LOOP
        // ============================================================================
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            if (typeof grassUniforms !== 'undefined') grassUniforms.uTime.value = elapsed;
            if (typeof animatedTreeCrowns !== 'undefined') animatedTreeCrowns.forEach(t => { t.group.rotation.z = Math.sin(elapsed * 1.2 + t.phase) * 0.025; });

            // Football Physics
            const nearPitch = playerFootPos.x > 30 && playerFootPos.x < 86 && playerFootPos.z > 54 && playerFootPos.z < 92;
            document.getElementById('football-hud').style.display = nearPitch ? 'flex' : 'none';

            if (typeof ballState !== 'undefined' && typeof footballMesh !== 'undefined') {
                const dxB = ballState.pos.x - playerFootPos.x, dzB = ballState.pos.z - playerFootPos.z, distB = Math.hypot(dxB, dzB);
                if (distB < 0.85 && Math.abs(playerFootPos.y - ballState.pos.y) < 1.2) {
                    ballState.vel.set((dxB / (distB || 1)) * 6.5, 1.2, (dzB / (distB || 1)) * 6.5);
                    ballState.lastKickerUid = myUid; if (typeof syncBallToFirestore === 'function') syncBallToFirestore({ isReset: false });
                }

                if (ballState.vel.lengthSq() > 0.001 || ballState.pos.y > 0.44) {
                    ballState.vel.y -= 14.5 * dt; ballState.pos.addScaledVector(ballState.vel, dt);
                    if (ballState.pos.y <= 0.44) {
                        ballState.pos.y = 0.44; ballState.vel.y = Math.abs(ballState.vel.y) > 0.8 ? -ballState.vel.y * 0.58 : 0;
                        const fric = Math.pow(0.28, dt); ballState.vel.x *= fric; ballState.vel.z *= fric;
                    }
                    const inGoalMouthZ = ballState.pos.z >= 71.4 && ballState.pos.z <= 76.6 && ballState.pos.y <= 2.45;
                    if (inGoalMouthZ && ballState.pos.x <= 38.8 && ballState.lastKickerUid === myUid && typeof triggerValidatedGoal === 'function') { triggerValidatedGoal('GOLD'); return; }
                    if (inGoalMouthZ && ballState.pos.x >= 69.2 && ballState.lastKickerUid === myUid && typeof triggerValidatedGoal === 'function') { triggerValidatedGoal('CYAN'); return; }
                    
                    if (ballState.pos.x < 37.5) { ballState.pos.x = 37.5; ballState.vel.x *= -0.7; }
                    if (ballState.pos.x > 70.5) { ballState.pos.x = 70.5; ballState.vel.x *= -0.7; }
                    if (ballState.pos.z < 62.5) { ballState.pos.z = 62.5; ballState.vel.z *= -0.7; }
                    if (ballState.pos.z > 85.5) { ballState.pos.z = 85.5; ballState.vel.z *= -0.7; }

                    footballMesh.rotation.z -= ballState.vel.x * dt * 2.2; footballMesh.rotation.x += ballState.vel.z * dt * 2.2;
                }
                footballMesh.position.copy(ballState.pos);
            }

            // Update NPCs
            if (typeof facultyNPCs !== 'undefined') facultyNPCs.forEach(npc => npc.update(dt, elapsed, playerFootPos));

            if (myChatText && (Date.now() - myChatTimestamp > 10000)) {
                myChatText = ""; playerAvatar.updateOverheadTag(myCallsign, myTitle, "");
            }

            for (let uid in remotePlayers) {
                const rp = remotePlayers[uid];
                rp.actor.wrapper.position.lerp(rp.targetPos, Math.min(1, dt * 8));
                rp.actor.wrapper.rotation.y += (rp.targetYaw - rp.actor.wrapper.rotation.y) * Math.min(1, dt * 8);
                if (typeof animateVoxelPose === 'function') animateVoxelPose(rp.actor.bones, rp.state, elapsed);
            }

            if (!orbitMode && !activeMentorId) {
                let nearMentorHitbox = null; let minMentorDist = 2.85;
                for (const obj of (typeof interactableObjects !== 'undefined' ? interactableObjects : [])) {
                    if (obj.userData?.interactType === 'mentor') {
                        const wp = new THREE.Vector3(); obj.getWorldPosition(wp);
                        const d = Math.hypot(wp.x - playerFootPos.x, wp.z - playerFootPos.z);
                        if (d < minMentorDist) { minMentorDist = d; nearMentorHitbox = obj; }
                    }
                }
                const reticleEl = document.getElementById('reticle'), promptEl = document.getElementById('interact-prompt'), promptLabelEl = document.getElementById('interact-label');
                if (nearMentorHitbox) {
                    activeHoveredTarget = nearMentorHitbox; reticleEl.classList.add('hover-active');
                    promptLabelEl.textContent = nearMentorHitbox.userData.getPrompt(); promptEl.style.display = 'flex';
                } else {
                    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
                    const hits = typeof interactableObjects !== 'undefined' ? raycaster.intersectObjects(interactableObjects) : [];
                    if (hits.length > 0 && hits[0].distance < 8.5) {
                        activeHoveredTarget = hits[0].object; reticleEl.classList.add('hover-active');
                        promptLabelEl.textContent = activeHoveredTarget.userData.getPrompt ? activeHoveredTarget.userData.getPrompt() : 'Interact';
                        promptEl.style.display = 'flex';
                    } else {
                        activeHoveredTarget = null; reticleEl.classList.remove('hover-active'); promptEl.style.display = 'none';
                    }
                }
            } else {
                document.getElementById('interact-prompt').style.display = 'none';
            }

            if (orbitMode) {
                camera.position.set(Math.sin(orbitAngle) * Math.cos(orbitElevation) * orbitDistance, Math.max(4.0, Math.sin(orbitElevation) * orbitDistance), 30 + Math.cos(orbitAngle) * Math.cos(orbitElevation) * orbitDistance);
                camera.lookAt(0, 2.5, 25);
            } else if (targetTeleport) {
                playerFootPos.lerp(targetTeleport, 0.14); camYaw += (targetTeleport.yaw - camYaw) * 0.14; camPitch += (targetTeleport.pitch - camPitch) * 0.14;
                if (Math.hypot(targetTeleport.x - playerFootPos.x, targetTeleport.z - playerFootPos.z) < 0.12) targetTeleport = null;
                playerAvatar.wrapper.position.copy(playerFootPos);
            } else {
                if (activeMentorId) {
                    currentLocomotionState = 'idle';
                } else {
                    const moveSpeed = (keys.shift ? 8.5 : 4.8) * dt; const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw), rtX = Math.cos(camYaw), rtZ = -Math.sin(camYaw);
                    let moveX = 0, moveZ = 0;
                    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'SELECT') {
                        if (keys.forward) { moveX += fwdX * moveSpeed; moveZ += fwdZ * moveSpeed; } if (keys.backward) { moveX -= fwdX * moveSpeed; moveZ -= fwdZ * moveSpeed; }
                        if (keys.left) { moveX -= rtX * moveSpeed; moveZ -= rtZ * moveSpeed; } if (keys.right) { moveX += rtX * moveSpeed; moveZ += rtZ * moveSpeed; }
                    }
                    const candX = Math.max(-125, Math.min(125, playerFootPos.x + moveX)); if (!PhysicsWorld.checkHorizontalCollision(candX, playerFootPos.y, playerFootPos.z)) playerFootPos.x = candX;
                    const candZ = Math.max(-95, Math.min(125, playerFootPos.z + moveZ)); if (!PhysicsWorld.checkHorizontalCollision(playerFootPos.x, playerFootPos.y, candZ)) playerFootPos.z = candZ;

                    const supportY = PhysicsWorld.getSupportingFloorY(playerFootPos.x, playerFootPos.y, playerFootPos.z);
                    if (playerFootPos.y <= supportY + 0.08 && playerVelY <= 0) { playerFootPos.y += (supportY - playerFootPos.y) * Math.min(1, dt * 18); playerVelY = 0; isGrounded = true; } 
                    else { playerVelY += PhysicsWorld.gravity * dt; playerFootPos.y += playerVelY * dt; if (playerFootPos.y <= supportY) { playerFootPos.y = supportY; playerVelY = 0; isGrounded = true; } else isGrounded = false; }

                    const movingNow = Math.hypot(moveX, moveZ) > 0.002; currentLocomotionState = movingNow ? (keys.shift ? 'run' : 'walk') : 'idle';
                    playerAvatar.wrapper.position.copy(playerFootPos);

                    if (movingNow) playerAvatar.wrapper.rotation.y = Math.atan2(moveX, moveZ);
                }

                if (typeof animateVoxelPose === 'function') animateVoxelPose(playerAvatar.bones, currentLocomotionState, elapsed);

                const eyeH = PhysicsWorld.playerEyeHeight;
                if (activeMentorId && isThirdPerson) {
                    const activeNpc = facultyNPCs.find(n => n.id === activeMentorId);
                    if (activeNpc) {
                        const mPos = activeNpc.rig.wrapper.position, midX = (playerFootPos.x + mPos.x) * 0.5, midZ = (playerFootPos.z + mPos.z) * 0.5;
                        const dxC = mPos.x - playerFootPos.x, dzC = mPos.z - playerFootPos.z, lenC = Math.hypot(dxC, dzC) || 1;
                        const sideX = -dzC / lenC, sideZ = dxC / lenC;
                        const desiredCamPos = new THREE.Vector3(midX + sideX * 2.55 - (dxC / lenC) * 0.7, playerFootPos.y + 1.55, midZ + sideZ * 2.55 - (dzC / lenC) * 0.7);
                        camera.position.lerp(desiredCamPos, Math.min(1, dt * 6));
                        camera.lookAt(midX - sideX * 0.45, playerFootPos.y + 1.32, midZ - sideZ * 0.45);
                    }
                } else {
                    if (isThirdPerson) camera.position.set(playerFootPos.x + Math.sin(camYaw) * 2.9, playerFootPos.y + eyeH + 0.45, playerFootPos.z + Math.cos(camYaw) * 2.9);
                    else camera.position.set(playerFootPos.x, playerFootPos.y + eyeH, playerFootPos.z);
                    camera.rotation.order = 'YXZ'; camera.rotation.y = camYaw; camera.rotation.x = camPitch;
                }
                document.getElementById('floor-status').textContent = `Elev: ${playerFootPos.y.toFixed(1)}m`;
            }

            if (Math.floor(elapsed * 15) !== Math.floor((elapsed - dt) * 15) && typeof renderMinimapRadar === 'function') renderMinimapRadar();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
